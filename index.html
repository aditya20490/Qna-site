<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#050506;
  --panel:rgba(18,18,21,.78);
  --panel-strong:rgba(20,20,24,.92);
  --border:rgba(255,255,255,.09);
  --border-hover:rgba(255,255,255,.16);
  --text:#f5f5f7;
  --muted:#8d8d98;
  --soft:#b8b8c2;
  --accent:#ffffff;
  --accent-text:#050505;
  --input:rgba(7,7,9,.78);
}

html{
  min-height:100%;

}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,rgba(255,255,255,.085),transparent 32%),
    radial-gradient(circle at 0% 70%,rgba(110,90,255,.055),transparent 30%),
    radial-gradient(circle at 100% 35%,rgba(255,255,255,.035),transparent 28%),
    #050506;
  color:var(--text);
  font-family:
    Inter,
    ui-sans-serif,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:28px 18px;
  position:relative;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      rgba(255,255,255,.012) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.012) 1px,
      transparent 1px
    );
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,black,transparent 85%);
}

.container{
  width:100%;
  max-width:720px;
  position:relative;
  z-index:1;
}

.card{
  position:relative;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018) 45%,
      rgba(255,255,255,.008)

  border:1px solid var(--border);
  border-radius:26px;
  padding:34px;

  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  top:-170px;
  right:-100px;
  background:rgba(255,255,255,.06);
  filter:blur(70px);
  border-radius:50%;
  pointer-events:none;
}

.card::after{
  content:"";
  position:absolute;
  left:30px;
  right:30px;
  top:0;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.18),
    transparent
  );
}

.hidden{
  display:none !important;
}

/* AUTH */

.auth-header{
  position:relative;
  z-index:1;
  margin-bottom:30px;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:#9e9ea9;
  font-size:11px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  margin-bottom:14px;
}

.eyebrow-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 14px rgba(255,255,255,.65);
}

h1{
  margin:0;
  font-size:clamp(30px,6vw,42px);
  line-height:1.05;
  letter-spacing:-.045em;
  font-weight:750;
}

.auth-title{
  max-width:460px;
}

.subtitle{
  color:var(--muted);

  line-height:1.6;
}

.google-box{

.divider{

  gap:13px;

  font-size:10px;
  font-weight:700;
  letter-spacing:.15em;

}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.09)

}

.divider::after{

    90deg,
    rgba(255,255,255,.09),

}

/* FORM */

input,
textarea{
  width:100%;
  background:var(--input);
  color:white;
  border:1px solid rgba(255,255,255,.09);
  border-radius:15px;
  padding:15px 16px;
  font-family:inherit;
  font-size:15px;
  outline:none;
  margin-bottom:12px;
  transition:

    background .2s ease,

input::placeholder,
textarea::placeholder{

}

input:focus,
textarea:focus{
  border-color:rgba(255,255,255,.27);
  background:rgba(10,10,13,.94);

}

textarea{
  min-height:145px;
  resize:vertical;
  line-height:1.6;
}

/* BUTTONS */

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px 16px;
  font-family:inherit;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  margin-top:8px;
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease,
    border-color .18s ease;
}

button:active{
  transform:scale(.985);
}

.primary{
  background:#f4f4f5;
  color:#080809;
  box-shadow:

.primary:hover{

.secondary{

.secondary:hover{

/* APP HEADER */

.topbar{

.app-label{

.composer-label{

#submitButton{

.questions-title{

.question-count-label{

}

#questionsList > p{

.question{

.question-text{
  color:#eeeeF2;
  line-height:1.65;
  font-size:14px;
  margin-bottom:12px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.status{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:999px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.06);
  font-size:10px;
  color:#9898a3;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-weight:700;
}

.answer{
  margin-top:15px;
  padding:14px 15px;
  border-top:1px solid rgba(255,255,255,.075);
  color:#d6d6dc;
  line-height:1.65;
  font-size:14px;
  background:rgba(255,255,255,.018);
  border-radius:12px;
}

.answer strong{
  display:block;
  color:#fff;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.1em;

/* MOBILE */

@media(max-width:380px){

/* REDUCED MOTION */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    scroll-behavior:auto !important;
    transition:none !important;
  }

}
</style>

<script>

const SUPABASE_URL =
"https://sklysjwjztklmbaxwjtj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ZtJM6KEEhaGrClvzLkJXpg_Usb7T0ZK";

const GOOGLE_CLIENT_ID =
"864938013815-5t6so61a15m2luva7r94jsthj5ib6o2r.apps.googleusercontent.com";


/* VAPID PUBLIC KEY */

const VAPID_PUBLIC_KEY =
"BB2IJuzO__vQvpoxHRxpUYGNJKM-XYQydJrRjuVp8cdQT7rCtVCG3ugg_ga-5rXBxQCPVPo9lLzwgEz8RFwINag";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true
}
});


let userRealtimeChannel = null;


/* ESCAPE HTML */

function escapeHTML(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* AUTH SCREEN */

function showAuth(){

document
.getElementById("authCard")
.classList.remove("hidden");

document
.getElementById("appCard")
.classList.add("hidden");

stopUserRealtime();

}


/* APP SCREEN */

async function showApp(){

document
.getElementById("authCard")
.classList.add("hidden");

document
.getElementById("appCard")
.classList.remove("hidden");


const {
data:{user}
} =
await supabaseClient.auth.getUser();


if(!user){
return;
}


loadQuestions();

startUserRealtime(user.id);

}


/* AUTH MESSAGE */

function showAuthMessage(message){

document
.getElementById("authMessage")
.innerHTML =
message
?
`<div class="message">${escapeHTML(message)}</div>`
:"";

}


/* APP MESSAGE */

function showAppMessage(message){

document
.getElementById("appMessage")
.innerHTML =
message
?
`<div class="message">${escapeHTML(message)}</div>`
:"";

}


/* STOP USER REALTIME */

function stopUserRealtime(){

if(userRealtimeChannel){

supabaseClient.removeChannel(
userRealtimeChannel
);

userRealtimeChannel = null;

}

}


/* START USER REALTIME */

function startUserRealtime(userId){

stopUserRealtime();


userRealtimeChannel =
supabaseClient
.channel(`user-questions-${userId}`)
.on(
"postgres_changes",
{
event:"UPDATE",
schema:"public",
table:"questions",
filter:`user_id=eq.${userId}`
},
async(payload)=>{

loadQuestions();


const newAnswer =
payload?.new?.answer || "";

const oldAnswer =
payload?.old?.answer || "";


if(
newAnswer &&
newAnswer !== oldAnswer
){

showAppMessage(
"Aditya has answered your question!"
);


if(
"Notification" in window &&
Notification.permission === "granted"
){

try{

new Notification(
"Aditya Contact Portal",
{
body:"Aditya has answered your question."
}
);

}catch(error){

console.warn(
"Notification could not be shown:",
error
);

}

}

}

}
)
.subscribe((status)=>{

console.log(
"User realtime status:",
status
);

});

}


/* CONVERT VAPID KEY */

function urlBase64ToUint8Array(base64String){

const padding =
"=".repeat(
(4 - base64String.length % 4) % 4
);

const base64 =
(
base64String +
padding
)
.replace(/-/g,"+")
.replace(/_/g,"/");

const rawData =
window.atob(base64);

const outputArray =
new Uint8Array(
rawData.length
);

for(
let i=0;
i<rawData.length;
++i
){

outputArray[i] =
rawData.charCodeAt(i);

}

return outputArray;

}


/* SET UP REAL PUSH NOTIFICATIONS */

async function setupPushNotifications(user){

try{

if(
!("serviceWorker" in navigator) ||
!("PushManager" in window) ||
!("Notification" in window)
){

console.warn(
"Push notifications are not supported by this browser."
);

return false;

}


/* REGISTER SERVICE WORKER */

const registration =
await navigator.serviceWorker.register(
"/Qna-site/sw.js"
);

console.log(
"Service worker registered:",
registration.scope
);


/* ASK FOR NOTIFICATION PERMISSION */

if(
Notification.permission === "default"
){

const permission =
await Notification.requestPermission();

if(permission !== "granted"){

console.log(
"Notification permission was not granted."
);

return false;

}

}


if(
Notification.permission !== "granted"
){

return false;

}


/* GET EXISTING SUBSCRIPTION */

let subscription =
await registration.pushManager.getSubscription();


/* CREATE NEW SUBSCRIPTION */

if(!subscription){

subscription =
await registration.pushManager.subscribe({

userVisibleOnly:true,

applicationServerKey:
urlBase64ToUint8Array(
VAPID_PUBLIC_KEY
)

});

}


/* SAVE SUBSCRIPTION IN SUPABASE */

const {
error
} =
await supabaseClient
.from("push_subscriptions")
.upsert(
{
user_id:user.id,

subscription:
subscription.toJSON(),

updated_at:
new Date().toISOString()
},
{
onConflict:"user_id"
}
);


if(error){

console.error(
"Could not save push subscription:",
error
);

showAppMessage(
"Question submitted, but notification setup failed."
);

return false;

}


console.log(
"Push subscription saved successfully."
);

return true;

}catch(error){

console.error(
"Push notification setup failed:",
error
);

return false;

}

}


/* GOOGLE SIGN-IN */

async function handleGoogleCredential(response){

if(!response || !response.credential){

showAuthMessage(
"Google sign-in did not return a credential."
);

return;

}

showAuthMessage(
"Signing you in with Google..."
);


const {data,error} =
await supabaseClient.auth.signInWithIdToken({

provider:"google",

token:response.credential

});


if(error){

showAuthMessage(
"Google login error: " + error.message
);

return;

}


if(data.session){

showAuthMessage("");

showApp();

}

}


/* GOOGLE BUTTON */

function initializeGoogle(){

if(
!window.google ||
!window.google.accounts ||
!window.google.accounts.id
){

setTimeout(
initializeGoogle,
500
);

return;

}

window.google.accounts.id.initialize({

client_id:GOOGLE_CLIENT_ID,

callback:
handleGoogleCredential,

auto_select:false,

cancel_on_tap_outside:true,

use_fedcm_for_prompt:true

});


const box =
document.getElementById(
"googleButton"
);

const width =
Math.min(
400,
Math.max(
240,
box.clientWidth || 320
)
);


window.google.accounts.id.renderButton(

box,

{
theme:"outline",
size:"large",
width:width,
text:"continue_with",
shape:"rectangular",
logo_alignment:"left"
}

);

}

document

if(!user){

}


/* SUBMIT QUESTION */

const {error} =
await supabaseClient
.from("questions")
.insert({

question:question,

user_id:user.id,

status:"pending"

});


if(error){

showAppMessage(
"Could not submit question: " +
error.message
);

return;

}


input.value="";


showAppMessage(
"Question submitted successfully!"
);


/*
  PUSH SETUP IS DONE HERE BECAUSE
  THIS CLICK IS A USER GESTURE.
*/

await setupPushNotifications(user);


loadQuestions();

});


/* LOAD QUESTIONS */

async function loadQuestions(){

const {
data:{user}
} =
await supabaseClient.auth.getUser();

if(!user)return;


const {
data,
error
} =
await supabaseClient
.from("questions")
.select("*")
.eq("user_id",user.id)
.order(
"created_at",
{ascending:false}
);


const list =
document.getElementById(
"questionsList"
);


if(error){

list.innerHTML =
`<div class="message">
${escapeHTML(error.message)}
</div>`;

return;

}


if(!data || data.length===0){

list.innerHTML =
"<p style='color:#888'>No questions yet.</p>";

return;

}


list.innerHTML="";


data.forEach(item=>{

const div =
document.createElement(
"div"
);

div.className="question";


div.innerHTML=`

<div class="question-text">
${escapeHTML(item.question)}
</div>

<div class="status">
Status:
${escapeHTML(item.status || "pending")}
</div>

${
item.answer
?
`
<div class="answer">
<strong>Answer:</strong><br>
${escapeHTML(item.answer)}
</div>
`
:""
}

`;


list.appendChild(div);

});

}


/* AUTH STATE */

supabaseClient.auth.onAuthStateChange(
(event,session)=>{

if(session){

showApp();

}else{

showAuth();

}

});


/* START */

async function startApp(){

const {
data:{session},
error
} =
await supabaseClient.auth.getSession();


if(error){

showAuthMessage(
"Session error: " +
error.message
);

return;

}


if(session){

showApp();

}else{

showAuth();

}

}


startApp();

initializeGoogle();

</script>
