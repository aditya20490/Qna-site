<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya Contact Portal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#0b0b0f;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px
}

.container{
  width:100%;
  max-width:520px
}

.card{
  background:#15151c;
  border:1px solid #292934;
  border-radius:20px;
  padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.35)
}

h1{
  margin:0 0 8px;
  font-size:30px
}

h2{
  margin-top:30px
}

.subtitle{
  color:#9999a8;
  margin-bottom:25px
}

input,textarea{
  width:100%;
  background:#0d0d12;
  color:white;
  border:1px solid #30303b;
  border-radius:12px;
  padding:14px;
  font-size:15px;
  outline:none;
  margin-bottom:12px
}

textarea{
  min-height:130px;
  resize:vertical
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px
}

.primary{
  background:#6c63ff;
  color:white
}

.secondary{
  background:#292934;
  color:white
}

.divider{
  text-align:center;
  color:#777783;
  margin:18px 0
}

.hidden{
  display:none
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#20202a;
  color:#ddd;
  font-size:14px;
  line-height:1.5
}

.google-box{
  display:flex;
  justify-content:center;
  width:100%;
  min-height:44px
}

.question{
  background:#0d0d12;
  border:1px solid #292934;
  border-radius:12px;
  padding:15px;
  margin-top:12px
}

.question-text{
  line-height:1.5;
  margin-bottom:10px
}

.status{
  font-size:13px;
  color:#9999a8
}

.answer{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #292934;
  color:#d8d8ff;
  line-height:1.5
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px
}

.logout{
  width:auto;
  padding:8px 12px;
  margin:0;
  font-size:13px
}
</style>
</head>

<body>

<div class="container">

<div id="authCard" class="card">

<h1>Contact Aditya</h1>

<div class="subtitle">
Sign in to ask your question.
</div>

<div id="googleButton" class="google-box"></div>

<div class="divider">OR</div>

<input
id="email"
type="email"
placeholder="Email address"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button id="loginButton" class="primary">
Login
</button>

<button id="signupButton" class="secondary">
Create account
</button>

<div id="authMessage"></div>

</div>


<div id="appCard" class="card hidden">

<div class="topbar">

<h1>Ask a Question</h1>

<button id="logoutButton" class="secondary logout">
Logout
</button>

</div>

<textarea
id="questionInput"
placeholder="Write your question here..."
></textarea>

<button id="submitButton" class="primary">
Send Question
</button>

<div id="appMessage"></div>

<h2>My Questions</h2>

<div id="questionsList">
Loading...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://sklysjwjztklmbaxwjtj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ZtJM6KEEhaGrClvzLkJXpg_Usb7T0ZK";

const GOOGLE_CLIENT_ID =
"864938013815-5t6so61a15m2luva7r94jsthj5ib6o2r.apps.googleusercontent.com";


/* VAPID PUBLIC KEY */

const VAPID_PUBLIC_KEY =
"BB2IJuzO__vQvpoxHRxpUYGNJKM-XYQydJrRjuVp8cdQT7rCtVCG3ugg_ga-5rXBxQCPVPo9lLzwgEz8RFwINag";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true
}
});


let userRealtimeChannel = null;


/* ESCAPE HTML */

function escapeHTML(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* AUTH SCREEN */

function showAuth(){

document
.getElementById("authCard")
.classList.remove("hidden");

document
.getElementById("appCard")
.classList.add("hidden");

stopUserRealtime();

}


/* APP SCREEN */

async function showApp(){

document
.getElementById("authCard")
.classList.add("hidden");

document
.getElementById("appCard")
.classList.remove("hidden");


const {
data:{user}
} =
await supabaseClient.auth.getUser();


if(!user){
return;
}


loadQuestions();

startUserRealtime(user.id);

}


/* AUTH MESSAGE */

function showAuthMessage(message){

document
.getElementById("authMessage")
.innerHTML =
message
?
`<div class="message">${escapeHTML(message)}</div>`
:"";

}


/* APP MESSAGE */

function showAppMessage(message){

document
.getElementById("appMessage")
.innerHTML =
message
?
`<div class="message">${escapeHTML(message)}</div>`
:"";

}


/* STOP USER REALTIME */

function stopUserRealtime(){

if(userRealtimeChannel){

supabaseClient.removeChannel(
userRealtimeChannel
);

userRealtimeChannel = null;

}

}


/* START USER REALTIME */

function startUserRealtime(userId){

stopUserRealtime();


userRealtimeChannel =
supabaseClient
.channel(`user-questions-${userId}`)
.on(
"postgres_changes",
{
event:"UPDATE",
schema:"public",
table:"questions",
filter:`user_id=eq.${userId}`
},
async(payload)=>{

loadQuestions();


const newAnswer =
payload?.new?.answer || "";

const oldAnswer =
payload?.old?.answer || "";


if(
newAnswer &&
newAnswer !== oldAnswer
){

showAppMessage(
"Aditya has answered your question!"
);


if(
"Notification" in window &&
Notification.permission === "granted"
){

try{

new Notification(
"Aditya Contact Portal",
{
body:"Aditya has answered your question."
}
);

}catch(error){

console.warn(
"Notification could not be shown:",
error
);

}

}

}

}
)
.subscribe((status)=>{

console.log(
"User realtime status:",
status
);

});

}


/* CONVERT VAPID KEY */

function urlBase64ToUint8Array(base64String){

const padding =
"=".repeat(
(4 - base64String.length % 4) % 4
);

const base64 =
(
base64String +
padding
)
.replace(/-/g,"+")
.replace(/_/g,"/");

const rawData =
window.atob(base64);

const outputArray =
new Uint8Array(
rawData.length
);

for(
let i=0;
i<rawData.length;
++i
){

outputArray[i] =
rawData.charCodeAt(i);

}

return outputArray;

}


/* SET UP REAL PUSH NOTIFICATIONS */

async function setupPushNotifications(user){

try{

if(
!("serviceWorker" in navigator) ||
!("PushManager" in window) ||
!("Notification" in window)
){

console.warn(
"Push notifications are not supported by this browser."
);

return false;

}


/* REGISTER SERVICE WORKER */

const registration =
await navigator.serviceWorker.register(
"/Qna-site/sw.js"
);

console.log(
"Service worker registered:",
registration.scope
);


/* ASK FOR NOTIFICATION PERMISSION */

if(
Notification.permission === "default"
){

const permission =
await Notification.requestPermission();

if(permission !== "granted"){

console.log(
"Notification permission was not granted."
);

return false;

}

}


if(
Notification.permission !== "granted"
){

return false;

}


/* GET EXISTING SUBSCRIPTION */

let subscription =
await registration.pushManager.getSubscription();


/* CREATE NEW SUBSCRIPTION */

if(!subscription){

subscription =
await registration.pushManager.subscribe({

userVisibleOnly:true,

applicationServerKey:
urlBase64ToUint8Array(
VAPID_PUBLIC_KEY
)

});

}


/* SAVE SUBSCRIPTION IN SUPABASE */

const {
error
} =
await supabaseClient
.from("push_subscriptions")
.upsert(
{
user_id:user.id,

subscription:
subscription.toJSON(),

updated_at:
new Date().toISOString()
},
{
onConflict:"user_id"
}
);


if(error){

console.error(
"Could not save push subscription:",
error
);

showAppMessage(
"Question submitted, but notification setup failed."
);

return false;

}


console.log(
"Push subscription saved successfully."
);

return true;

}catch(error){

console.error(
"Push notification setup failed:",
error
);

return false;

}

}


/* GOOGLE SIGN-IN */

async function handleGoogleCredential(response){

if(!response || !response.credential){

showAuthMessage(
"Google sign-in did not return a credential."
);

return;

}

showAuthMessage(
"Signing you in with Google..."
);


const {data,error} =
await supabaseClient.auth.signInWithIdToken({

provider:"google",

token:response.credential

});


if(error){

showAuthMessage(
"Google login error: " + error.message
);

return;

}


if(data.session){

showAuthMessage("");

showApp();

}

}


/* GOOGLE BUTTON */

function initializeGoogle(){

if(
!window.google ||
!window.google.accounts ||
!window.google.accounts.id
){

setTimeout(
initializeGoogle,
500
);

return;

}

window.google.accounts.id.initialize({

client_id:GOOGLE_CLIENT_ID,

callback:
handleGoogleCredential,

auto_select:false,

cancel_on_tap_outside:true,

use_fedcm_for_prompt:true

});


const box =
document.getElementById(
"googleButton"
);

const width =
Math.min(
400,
Math.max(
240,
box.clientWidth || 320
)
);


window.google.accounts.id.renderButton(

box,

{
theme:"outline",
size:"large",
width:width,
text:"continue_with",
shape:"rectangular",
logo_alignment:"left"
}

);

}


/* EMAIL SIGNUP */

document
.getElementById("signupButton")
.addEventListener(
"click",
async()=>{

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

if(!email || !password){

showAuthMessage(
"Enter email and password."
);

return;

}


const {data,error} =
await supabaseClient.auth.signUp({

email,
password,

options:{
emailRedirectTo:
"https://aditya20490.github.io/Qna-site/"
}

});


if(error){

showAuthMessage(
error.message
);

return;

}


if(data.session){

showApp();

}else{

showAuthMessage(
"Account created. Check your email to confirm it."
);

}

});


/* EMAIL LOGIN */

document
.getElementById("loginButton")
.addEventListener(
"click",
async()=>{

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

if(!email || !password){

showAuthMessage(
"Enter email and password."
);

return;

}


const {data,error} =
await supabaseClient.auth.signInWithPassword({

email,
password

});


if(error){

showAuthMessage(
error.message
);

return;

}


if(data.session){

showApp();

}

});


/* LOGOUT */

document
.getElementById("logoutButton")
.addEventListener(
"click",
async()=>{

stopUserRealtime();

await supabaseClient.auth.signOut();

showAuth();

});


/* SEND QUESTION */

document
.getElementById("submitButton")
.addEventListener(
"click",
async()=>{

const input =
document.getElementById(
"questionInput"
);

const question =
input.value.trim();


if(!question){

showAppMessage(
"Write a question first."
);

return;

}


const {
data:{user}
} =
await supabaseClient.auth.getUser();


if(!user){

showAppMessage(
"Please login again."
);

return;

}


/* SUBMIT QUESTION */

const {error} =
await supabaseClient
.from("questions")
.insert({

question:question,

user_id:user.id,

status:"pending"

});


if(error){

showAppMessage(
"Could not submit question: " +
error.message
);

return;

}


input.value="";


showAppMessage(
"Question submitted successfully!"
);


/*
  PUSH SETUP IS DONE HERE BECAUSE
  THIS CLICK IS A USER GESTURE.
*/

await setupPushNotifications(user);


loadQuestions();

});


/* LOAD QUESTIONS */

async function loadQuestions(){

const {
data:{user}
} =
await supabaseClient.auth.getUser();

if(!user)return;


const {
data,
error
} =
await supabaseClient
.from("questions")
.select("*")
.eq("user_id",user.id)
.order(
"created_at",
{ascending:false}
);


const list =
document.getElementById(
"questionsList"
);


if(error){

list.innerHTML =
`<div class="message">
${escapeHTML(error.message)}
</div>`;

return;

}


if(!data || data.length===0){

list.innerHTML =
"<p style='color:#888'>No questions yet.</p>";

return;

}


list.innerHTML="";


data.forEach(item=>{

const div =
document.createElement(
"div"
);

div.className="question";


div.innerHTML=`

<div class="question-text">
${escapeHTML(item.question)}
</div>

<div class="status">
Status:
${escapeHTML(item.status || "pending")}
</div>

${
item.answer
?
`
<div class="answer">
<strong>Answer:</strong><br>
${escapeHTML(item.answer)}
</div>
`
:""
}

`;


list.appendChild(div);

});

}


/* AUTH STATE */

supabaseClient.auth.onAuthStateChange(
(event,session)=>{

if(session){

showApp();

}else{

showAuth();

}

});


/* START */

async function startApp(){

const {
data:{session},
error
} =
await supabaseClient.auth.getSession();


if(error){

showAuthMessage(
"Session error: " +
error.message
);

return;

}


if(session){

showApp();

}else{

showAuth();

}

}


startApp();

initializeGoogle();

</script>

</body>
</html>
