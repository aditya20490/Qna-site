<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aditya Admin Panel</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #050505;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #f5f5f5;
      padding: 28px 18px 50px;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,0.055), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(255,255,255,0.04), transparent 25%),
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px),
        #050505;
      background-size: auto, auto, 42px 42px, 42px 42px, auto;
    }

    .container {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .title-wrap {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.08;
      letter-spacing: -1.4px;
      color: #ffffff;
    }

    .subtitle {
      color: #8f8f8f;
      margin-top: 10px;
      font-size: 15px;
      line-height: 1.5;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      vertical-align: middle;
      margin-left: 8px;
      padding: 6px 10px;
      border: 1px solid rgba(74, 222, 128, 0.25);
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.10);
      color: #86efac;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.06);
    }

    .live::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.8);
    }

    .top-actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 11px;
      padding: 12px 17px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition:
        transform 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .logout {
      background: rgba(255,255,255,0.07);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .logout:hover {
      background: rgba(255,255,255,0.11);
    }

    .refresh {
      background: #ffffff;
      color: #050505;
      border: 1px solid #ffffff;
    }

    .refresh:hover {
      background: #e8e8e8;
    }

    .message {
      padding: 13px 15px;
      border-radius: 12px;
      margin-bottom: 18px;
      display: none;
      border: 1px solid transparent;
      font-size: 14px;
      line-height: 1.45;
      backdrop-filter: blur(14px);
    }

    .error {
      background: rgba(127, 29, 29, 0.24);
      color: #fca5a5;
      border-color: rgba(248, 113, 113, 0.20);
    }

    .success {
      background: rgba(20, 83, 45, 0.24);
      color: #86efac;
      border-color: rgba(74, 222, 128, 0.20);
    }

    .question-card {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.075),
          rgba(255,255,255,0.035)
        );
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 17px;
      box-shadow:
        0 18px 50px rgba(0,0,0,0.28),
        inset 0 1px 0 rgba(255,255,255,0.035);
      backdrop-filter: blur(18px);
    }

    .question-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.22),
        transparent
      );
    }

    .question {
      font-size: 17px;
      line-height: 1.65;
      margin-bottom: 15px;
      color: #f5f5f5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .meta {
      font-size: 12px;
      line-height: 1.65;
      color: #777777;
      margin-bottom: 16px;
      overflow-wrap: anywhere;
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(234, 179, 8, 0.10);
      border: 1px solid rgba(250, 204, 21, 0.18);
      color: #fde68a;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 16px;
      text-transform: capitalize;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 115px;
      resize: vertical;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      outline: none;
      background: rgba(0,0,0,0.25);
      color: #ffffff;
      font-size: 15px;
      font-family: inherit;
      line-height: 1.55;
      margin-bottom: 11px;
      transition:
        border-color 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;
    }

    textarea::placeholder {
      color: #666666;
    }

    textarea:focus {
      border-color: rgba(255,255,255,0.32);
      background: rgba(0,0,0,0.38);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.045);
    }

    .answer-btn {
      background: #ffffff;
      color: #050505;
      border: 1px solid #ffffff;
      padding: 12px 18px;
    }

    .answer-btn:hover {
      background: #e8e8e8;
    }

    .answer {
      margin-top: 12px;
      padding: 16px;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: #d7d7d7;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .answer strong {
      color: #ffffff;
    }

    .empty {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.065),
          rgba(255,255,255,0.025)
        );
      border: 1px solid rgba(255,255,255,0.09);
      padding: 30px 20px;
      border-radius: 18px;
      color: #777777;
      text-align: center;
      line-height: 1.5;
      backdrop-filter: blur(16px);
    }

    @media (max-width: 620px) {
      body {
        padding: 20px 13px 40px;
      }

      .topbar {
        margin-bottom: 22px;
      }

      h1 {
        font-size: 30px;
      }

      .live {
        font-size: 10px;
        padding: 5px 8px;
      }

      .top-actions {
        width: 100%;
      }

      .top-actions button {
        flex: 1;
      }

      .question-card {
        padding: 18px;
        border-radius: 16px;
      }

      .question {
        font-size: 16px;
      }
    }
  </style></head><body><div class="container">  <div class="topbar">
    <div class="title-wrap">
      <h1>
        Aditya Admin Panel
        <span class="live">LIVE</span>
      </h1>  <div class="subtitle">
    Manage questions submitted by users
  </div>
</div>

<div class="top-actions">
  <button class="refresh" id="refreshBtn">Refresh</button>
  <button class="logout" id="logoutBtn">Logout</button>
</div>

  </div>  <div id="message" class="message"></div>  <div id="questionsContainer">
    <div class="empty">Loading questions...</div>
  </div></div><script>
  const SUPABASE_URL =
    "https://sklysjwjztklmbaxwjtj.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_ZtJM6KEEhaGrClvzLkJXpg_Usb7T0ZK";

  const ADMIN_ID =
    "01d5205d-a9c3-4a83-90da-fde7ad021f01";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

  const container =
    document.getElementById("questionsContainer");

  const message =
    document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
    message.style.display = "block";

    setTimeout(() => {
      message.style.display = "none";
    }, 4000);
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text ?? "";
    return div.innerHTML;
  }

  async function checkAdmin() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
      window.location.href = "index.html";
      return false;
    }

    if (session.user.id !== ADMIN_ID) {

      container.innerHTML =
        '<div class="empty">Access denied. This account is not the admin.</div>';

      return false;
    }

    return true;
  }

  async function loadQuestions() {

    container.innerHTML =
      '<div class="empty">Loading questions...</div>';

    const allowed = await checkAdmin();

    if (!allowed) return;

    const { data, error } =
      await supabaseClient
        .from("questions")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if (error) {

      container.innerHTML =
        '<div class="empty">Error loading questions: ' +
        escapeHtml(error.message) +
        '</div>';

      return;
    }

    renderQuestions(data || []);
  }

  function renderQuestions(data) {

    if (!data || data.length === 0) {

      container.innerHTML =
        '<div class="empty">No questions have been submitted yet.</div>';

      return;
    }

    container.innerHTML = "";

    data.forEach(q => {

      const card =
        document.createElement("div");

      card.className = "question-card";

      const date =
        new Date(q.created_at).toLocaleString();

      card.innerHTML = `

        <div class="question">
          ${escapeHtml(q.question)}
        </div>

        <div class="meta">
          User ID:
          ${escapeHtml(q.user_id || "Unknown")}
          <br>
          Submitted:
          ${escapeHtml(date)}
        </div>

        <div class="status">
          Status:
          ${escapeHtml(q.status || "pending")}
        </div>

        ${
          q.answer
          ?
          `
            <div class="answer">
              <strong>Your answer:</strong>
              <br><br>
              ${escapeHtml(q.answer)}
            </div>
          `
          :
          `
            <textarea
              id="answer-${q.id}"
              placeholder="Write your answer here..."
            ></textarea>        <button
          class="answer-btn"
          onclick="submitAnswer(${q.id})"
        >
          Send Answer
        </button>
      `
    }

  `;

  container.appendChild(card);
});

}

async function submitAnswer(questionId) {

const textarea =
  document.getElementById(
    "answer-" + questionId
  );

if (!textarea) return;

const answer =
  textarea.value.trim();

if (!answer) {

  showMessage(
    "Please write an answer first.",
    "error"
  );

  return;
}

const { error } =
  await supabaseClient
    .from("questions")
    .update({
      answer: answer,
      status: "answered"
    })
    .eq("id", questionId);

if (error) {

  showMessage(
    "Could not save answer: " +
    error.message,
    "error"
  );

  return;
}

showMessage(
  "Answer saved successfully!",
  "success"
);

await loadQuestions();

}

document
.getElementById("refreshBtn")
.addEventListener(
"click",
loadQuestions
);

document
.getElementById("logoutBtn")
.addEventListener(
"click",
async () => {

    await supabaseClient.auth.signOut();

    window.location.href =
      "index.html";
  }
);

async function startRealtime() {

const allowed =
  await checkAdmin();

if (!allowed) return;

supabaseClient
  .channel("admin-questions")
  .on(
    "postgres_changes",
    {
      event: "INSERT",
      schema: "public",
      table: "questions"
    },
    payload => {

      showMessage(
        "New question received!",
        "success"
      );

      loadQuestions();
    }
  )
  .on(
    "postgres_changes",
    {
      event: "UPDATE",
      schema: "public",
      table: "questions"
    },
    payload => {

      loadQuestions();
    }
  )
  .subscribe();

}

loadQuestions();
startRealtime();

</script></body>
</html>
